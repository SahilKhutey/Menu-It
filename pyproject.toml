[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "backend/migrations",
    ".venv",
    "tests",
    "frontend",
    "packages",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "T20", # flake8-print
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "B904", # within except clause, raise ... from
    "UP046", # Generic class uses Generic subclass instead of type parameters
    "UP042", # Class inherits from both str and Enum
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"backend/app/seed.py" = ["T201"]
"backend/app/scripts/*" = ["T201", "E402"]
"backend/migrations/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
