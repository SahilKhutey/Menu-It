name: Security Scans & Quality Gates

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/security.yml"
  push:
    branches:
      - main
      - develop
  schedule:
    # Run weekly security audit scan every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Dependency & SAST Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Python Static Analysis with Bandit
        run: bandit -r apps/api/src -ll -i || true

      - name: Python Dependency Audit
        run: |
          pip-audit --desc on || true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate

      - name: Frontend Dependency Vulnerability Audit
        run: pnpm audit --prod || true
