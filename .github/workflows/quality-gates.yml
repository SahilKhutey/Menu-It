name: Architecture and Quality Gates

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # Gate 1: Source and Architecture Validation
  backend-quality:
    name: Gate 1 & 2 - Backend Source & Architecture Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff

      - name: Gate 1 - Lint & Format Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Gate 2 - Architecture Boundary Enforcement
        run: |
          pytest tests/architecture/ -v

  # Gate 1: Frontend Quality
  frontend-quality:
    name: Gate 1 & 5 - Frontend Quality & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Gate 1 - Type Check & Lint
        working-directory: frontend
        run: |
          pnpm exec tsc --noEmit
          pnpm run lint

      - name: Gate 5 - Production Build Verification
        working-directory: frontend
        run: pnpm run build

  # Gate 3 & 4: Security and Automated Tests
  security-and-testing:
    name: Gate 3 & 4 - Security Verification & Automated Test Suites
    runs-on: ubuntu-latest
    needs: [backend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Gate 3 - Security & Tenant Isolation Tests
        run: |
          pytest tests/security/ -v

      - name: Gate 4 - Unit, Contract & Integration Test Suites
        run: |
          pytest tests/unit/ tests/contract/ tests/integration/ -v

  # Gate 6: Dual Deployment Profile Verification
  deployment-validation:
    name: Gate 6 - Dual-Profile Container & Deployment Check
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
