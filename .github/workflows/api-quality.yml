name: API Architecture Quality Gates

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "docs/api/**"
      - ".github/workflows/api-quality.yml"
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  api-contracts-and-validation:
    name: Gate 1 - OpenAPI Contract & Schema Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyyaml httpx pytest pytest-asyncio

      - name: Verify OpenAPI Export & Validation Script
        run: |
          python backend/app/scripts/export_openapi.py
          python backend/app/scripts/validate_openapi.py

      - name: Verify Machine-Readable Manifests Exist
        run: |
          python -c "
          import os, yaml
          manifests = [
              'backend/architecture/api_permissions.yaml',
              'backend/architecture/api_versions.yaml',
              'backend/architecture/error_codes.yaml',
              'backend/architecture/webhook_events.yaml',
              'backend/architecture/api_rate_limits.yaml',
          ]
          for m in manifests:
              assert os.path.exists(m), f'Missing {m}'
              with open(m, 'r') as f:
                  data = yaml.safe_load(f)
                  assert data, f'Empty {m}'
          print('All 5 machine-readable manifests validated successfully.')
          "

  backend-api-tests:
    name: Gate 2 - Backend REST & Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pytest-asyncio pyyaml

      - name: Execute ARC-07 API Catalogue Tests
        run: |
          pytest tests/api/test_arc07_api_catalogue.py -v

      - name: Execute Full System Test Suite
        run: |
          pytest tests/ -q

  frontend-contract-drift:
    name: Gate 3 - Frontend API Client & Contract Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify Frontend Build with Generated Contracts
        working-directory: frontend
        run: pnpm run build
