name: CI Quality Orchestrator

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository & Monorepo Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate

      - name: Verify Prettier Code Style
        run: pnpm format:check

  backend-quality:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Format Check
        run: ruff format --check src tests

      - name: Ruff Lint Check
        run: ruff check src tests

      - name: Pytest Unit & Security Tests
        run: python -m pytest tests/unit tests/security -v

  frontend-quality:
    name: Frontend Lint, Typecheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm -r lint

      - name: TypeScript Typecheck
        run: pnpm -r typecheck

      - name: Vitest Unit Tests
        run: pnpm test

      - name: Build Web Application
        run: pnpm --filter @menu-it/web build

      - name: Build Admin Application
        run: pnpm --filter @menu-it/admin build

  database-integration:
    name: Database Migrations & RLS Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: menu_it_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d menu_it_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/menu_it_test
      APP_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Alembic Migration Heads
        run: alembic heads

      - name: Apply Alembic Migrations
        run: alembic upgrade head

  security-scan:
    name: Dependency & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate

      - name: Node Production Audit
        run: pnpm audit --prod || true

  ci-summary:
    name: CI Quality Gate Summary
    runs-on: ubuntu-latest
    needs:
      - repository-validation
      - backend-quality
      - frontend-quality
      - database-integration
      - security-scan
    if: always()
    steps:
      - name: Check Status of Required Gates
        run: |
          if [ "${{ needs.repository-validation.result }}" != "success" ] || \
             [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ] || \
             [ "${{ needs.database-integration.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "[CI-SUMMARY] One or more required quality gates failed. Merging blocked."
            exit 1
          fi
          echo "[CI-SUMMARY] All mandatory quality gates passed successfully. PR is eligible for merge."
