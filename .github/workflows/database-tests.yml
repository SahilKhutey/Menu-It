name: Database & Migration Integration

on:
  pull_request:
    paths:
      - "apps/api/alembic/**"
      - "apps/api/src/menu_it/database/**"
      - "apps/api/tests/integration/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migrations:
    name: PostgreSQL Migration & Schema Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: menu_it_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d menu_it_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/menu_it_test
      APP_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Single Alembic Head
        run: alembic heads

      - name: Apply Migrations (Upgrade to Head)
        run: alembic upgrade head

      - name: Run Integration Database Tests
        run: python -m pytest tests/integration -v -m "not slow" --tb=short
