# ModularMenu — PostgreSQL Row-Level Security (RLS) Coverage Manifest
# Architecture Reference: ARC-05 Multi-Tenant Architecture (§8 & §23.1)
# Version: 1.0.0

engine: postgresql
setting_key: "app.current_organization_id"
fail_closed_expression: "NULLIF(current_setting('app.current_organization_id', true), '')::uuid"

tables:
  - table_name: organizations
    tenant_column: id
    policy_name: organizations_tenant_isolation
    force_rls: true
    permitted_roles:
      - modularmenu_app

  - table_name: memberships
    tenant_column: organization_id
    policy_name: memberships_tenant_isolation
    force_rls: true
    permitted_roles:
      - modularmenu_app

